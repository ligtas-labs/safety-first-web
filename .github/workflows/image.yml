name: Container
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: vars.IMAGE_PLATFORM == 'linux/arm64'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ vars.IMAGE_PLATFORM || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/ligtas-labs/safety-first-web:${{ github.sha }}
          build-args: VITE_API_BASE_URL=${{ (github.base_ref == 'main' || github.ref_name == 'main') && 'https://safety-first-api.michaelconstantino.dev' || vars.STAGING_API_URL }}
      - if: github.event_name == 'push'
        run: echo "ghcr.io/ligtas-labs/safety-first-web@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
